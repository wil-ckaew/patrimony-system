services:
  db:
    image: postgres:13
    container_name: patrimony-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - patrimony-network

  backend:
    build: ./backend
    container_name: patrimony-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RUST_LOG: debug
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT},http://${TAILSCALE_IP}:${FRONTEND_PORT},http://${TAILSCALE_IP}:${BACKEND_PORT},http://192.168.100.105:${FRONTEND_PORT},http://192.168.100.105:${BACKEND_PORT}"
    volumes:
      - ./uploads:/app/uploads
      - ./documents:/app/documents
      - ./backups:/app/backups
      - ./restore-backup.sh:/app/restore-backup.sh
      - ./backup.sh:/app/backup.sh
    networks:
      - patrimony-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://192.168.100.105:8090"
        NEXT_PUBLIC_BACKEND_URL: "http://192.168.100.105:8090"
    container_name: patrimony-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://192.168.100.105:8090"
      NEXT_PUBLIC_BACKEND_URL: "http://192.168.100.105:8090"
    networks:
      - patrimony-network

  ai-service:
    build: ./ai-service
    container_name: patrimony-ai
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${AI_PORT:-5001}:5000"
    volumes:
      - ./ai-service/models:/app/models
    networks:
      - patrimony-network

  backup:
    image: postgres:13
    container_name: patrimony-backup
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      bash -c "
      apt-get update &&
      apt-get install -y cron &&
      echo '0 2 * * * pg_dump -h db -U ${POSTGRES_USER} ${POSTGRES_DB} > /backups/backup-$$(date +\%Y-\%m-\%d_\%H-\%M-\%S).sql' > /etc/cron.d/db-backup &&
      echo '0 3 * * * find /backups -name \"*.sql\" -mtime +7 -delete' >> /etc/cron.d/db-backup &&
      chmod 0644 /etc/cron.d/db-backup &&
      crontab /etc/cron.d/db-backup &&
      cron -f
      "
    networks:
      - patrimony-network

volumes:
  postgres_data:
    name: patrimony-postgres-data

networks:
  patrimony-network:
    name: patrimony-network
    driver: bridge
